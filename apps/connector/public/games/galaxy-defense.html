<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Galaxy Defense — Mocci</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";

  // ── Kanvas & skala responsif ──────────────────────────────────────────────
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, U = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // U = faktor skala relatif area 960×540, dibatasi agar elemen tetap terbaca
    U = Math.max(0.5, Math.min(W / 960, H / 540));
  }
  window.addEventListener("resize", resize);
  resize();

  const fmt = (n) => Math.round(n).toLocaleString("id-ID");
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ── State game ────────────────────────────────────────────────────────────
  const S = {
    hp: 100, hpMax: 100, score: 0, combo: 0, mult: 1,
    dead: 0,           // sisa waktu respawn (detik)
    spawnAt: 0,        // waktu spawn berikutnya (ms, relatif S.time)
    time: 0, shake: 0, flash: 0, shield: 0,
    banner: null, connected: false, gotEvent: false,
    likes: 0, shares: 0,
  };
  let asteroids = [], beams = [], parts = [], floaters = [], waves = [];
  const stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random(), y: Math.random(), v: rnd(6, 22), s: rnd(0.6, 2) });
  }

  const baseY = () => H - 44 * U;
  const cannon = () => ({ x: W / 2, y: baseY() - 10 * U });

  // ── FX kecil ──────────────────────────────────────────────────────────────
  function floater(x, y, text, color, size) {
    floaters.push({ x, y, text, color, size: (size || 13) * U, life: 1, max: 1 });
  }
  function burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(30, 30 + power) * U;
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: rnd(0.4, 0.9), max: 0.9, color, s: rnd(1.5, 3.5) * U,
      });
    }
  }
  function banner(text, color) { S.banner = { text, color, life: 3.4 }; }

  // ── Asteroid ──────────────────────────────────────────────────────────────
  function spawnInterval() {
    return Math.max(520, 1350 - S.time * 8 - Math.min(S.score, 20000) * 0.035);
  }
  function spawnAsteroid() {
    const r = rnd(13, 32) * U;
    const hpBase = 10 + Math.min(30, S.score / 1500) + rnd(0, 14);
    const verts = [];
    const n = 8 + ((Math.random() * 4) | 0);
    for (let i = 0; i < n; i++) verts.push(rnd(0.72, 1.15));
    asteroids.push({
      x: rnd(r + 8, W - r - 8), y: -r - 4, r,
      vy: (34 + rnd(0, 26) + Math.min(34, S.score / 1400)) * U,
      vx: rnd(-12, 12) * U,
      hp: hpBase, maxHp: hpBase,
      rot: rnd(0, 6.28), spin: rnd(-0.8, 0.8),
      verts, hit: 0,
    });
  }
  function explode(a) {
    burst(a.x, a.y, "#fb923c", 16, 90);
    burst(a.x, a.y, "#fde68a", 8, 140);
    S.shake = Math.min(14, S.shake + 3 + a.r / (10 * U));
  }

  // ── Penanganan event dari connector (SSE) ─────────────────────────────────
  function onGift(ev) {
    const amount = Math.max(1, ev.amount || 1);
    S.score += amount * S.mult;
    S.gotEvent = true;
    const c = cannon();
    if (asteroids.length === 0) {
      // tetap tembak ke langit — gift harus terasa bereaksi
      beams.push({ x1: c.x, y1: c.y, x2: c.x + rnd(-80, 80) * U, y2: c.y - H * 0.5, life: 0.3 });
      burst(c.x, c.y - 6 * U, "#c084fc", 10, 120);
    }
    for (const a of asteroids) {
      a.hp -= amount;
      a.hit = 0.14;
      beams.push({ x1: c.x, y1: c.y, x2: a.x, y2: a.y, life: 0.3 });
      floater(a.x, a.y, "-" + fmt(amount), amount >= 1000 ? "#fbbf24" : "#fda4af",
        12 + Math.min(10, Math.log10(amount + 1) * 3));
    }
    killDead();
    S.shake = Math.min(20, S.shake + 2 + Math.log10(amount + 1) * 3.2);
    S.flash = Math.min(0.4, S.flash + 0.05 + amount / 26000);
    const name = (ev.data && ev.data.giftName) || "gift";
    const count = (ev.data && ev.data.giftCount) || 1;
    if (amount >= 1000) {
      banner(ev.user + " mengirim " + name + " x" + count + "!",
        amount >= 10000 ? "#fbbf24" : "#a855f7");
      if (amount >= 10000) burst(W / 2, H * 0.3, "#fbbf24", 40, 220);
    }
  }

  function onFollow(ev) {
    S.gotEvent = true;
    const heal = Math.min(15, S.hpMax - S.hp);
    if (heal > 0) {
      S.hp += heal;
      const c = cannon();
      floater(c.x, c.y - 26 * U, "+" + heal + " HP", "#4ade80", 14);
    }
    S.shield = 1.3;
    banner("★ " + ev.user + " mengikuti!", "#22d3ee");
  }

  function onChat() {
    S.gotEvent = true;
    S.combo += 1;
    const nm = 1 + Math.min(4, Math.floor(S.combo / 10));
    if (nm > S.mult) {
      S.mult = nm;
      floater(W / 2, H * 0.4, "KOMBO x" + nm, "#fbbf24", 22);
    }
  }

  // Like = charge: setiap 10 like menembakkan laser ke asteroid terkuat
  function onLike() {
    S.gotEvent = true;
    S.likes += 1;
    if (S.likes % 10 !== 0) return;
    const c = cannon();
    let target = null;
    for (const a of asteroids) if (!target || a.hp > target.hp) target = a;
    if (!target) {
      beams.push({ x1: c.x, y1: c.y, x2: c.x + rnd(-60, 60) * U, y2: c.y - H * 0.5, life: 0.3 });
      floater(c.x, c.y - 60 * U, "⚡ " + S.likes + " LIKE!", "#67e8f9", 16);
      S.shake = Math.min(6, S.shake + 2);
      return;
    }
    target.hp -= 12;
    target.hit = 0.14;
    beams.push({ x1: c.x, y1: c.y, x2: target.x, y2: target.y, life: 0.3 });
    floater(target.x, target.y, "-12 ⚡", "#67e8f9", 13);
    killDead();
    S.shake = Math.min(8, S.shake + 2);
  }

  // Share = gelombang kejut: 20 damage ke semua asteroid + banner
  function onShare(ev) {
    S.gotEvent = true;
    S.shares += 1;
    for (const a of asteroids) {
      a.hp -= 20;
      a.hit = 0.14;
      floater(a.x, a.y, "-20", "#fbbf24", 13);
    }
    killDead();
    waves.push({ life: 0.7, max: 0.7 });
    S.shake = Math.min(10, S.shake + 4);
    S.flash = Math.min(0.25, S.flash + 0.1);
    banner(ev.user + " membagikan stream!", "#34d399");
  }

  // Buang asteroid mati (hp ≤ 0) dengan ledakan
  function killDead() {
    const alive = [];
    for (const a of asteroids) {
      if (a.hp <= 0) {
        explode(a);
        floater(a.x, a.y - a.r, "HANCUR", "#fdba74", 12);
      } else {
        alive.push(a);
      }
    }
    asteroids = alive;
  }

  function onEvent(ev) {
    if (!ev) return;
    if (ev.type === "gift") onGift(ev);
    else if (ev.type === "follow") onFollow(ev);
    else if (ev.type === "chat") onChat();
    else if (ev.type === "like") onLike();
    else if (ev.type === "share") onShare(ev);
  }

  // ── SSE: stream event dari connector ──────────────────────────────────────
  // Parameter halaman (token/overlayId) diteruskan apa adanya.
  const es = new EventSource("/api/games/stream?" + location.search.replace(/^\?/, ""));
  es.onopen = () => { S.connected = true; };
  es.onerror = () => { S.connected = false; };
  es.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d && d.event) onEvent(d.event);
    } catch (_) { /* frame tidak valid — abaikan */ }
  };

  // ── Game over & reset (overlay tidak boleh macet) ─────────────────────────
  function gameOver() {
    const c = cannon();
    burst(c.x, baseY(), "#ef4444", 60, 260);
    burst(c.x, baseY(), "#fbbf24", 30, 180);
    S.shake = 26;
    S.flash = 0.5;
    S.dead = 2.6;
    banner("BASE HANCUR · memulihkan…", "#ef4444");
  }
  function reset() {
    asteroids = []; beams = []; parts = []; floaters = []; waves = [];
    S.hp = S.hpMax; S.score = 0; S.combo = 0; S.mult = 1;
    S.spawnAt = S.time * 1000 + 600;
  }

  // ── Loop utama ────────────────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    S.time += dt;

    S.shake = Math.max(0, S.shake - dt * 46);
    S.flash = Math.max(0, S.flash - dt * 1.6);
    S.shield = Math.max(0, S.shield - dt);
    if (S.banner) {
      S.banner.life -= dt;
      if (S.banner.life <= 0) S.banner = null;
    }

    if (S.dead > 0) {
      S.dead -= dt;
      if (S.dead <= 0) reset();
    } else if (S.time * 1000 >= S.spawnAt) {
      spawnAsteroid();
      S.spawnAt = S.time * 1000 + spawnInterval();
    }

    // asteroid — loop mundur agar aman saat splice
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.rot += a.spin * dt;
      if (a.hit > 0) a.hit -= dt;
      if (a.x < a.r || a.x > W - a.r) a.vx *= -1;
      if (a.y > baseY() - a.r * 0.4) {
        asteroids.splice(i, 1);
        if (S.dead <= 0) {
          S.hp = Math.max(0, S.hp - 25);
          burst(a.x, baseY(), "#f87171", 18, 150);
          S.shake = Math.min(22, S.shake + 9);
          floater(a.x, baseY() - 20 * U, "-25 HP", "#f87171", 15);
          if (S.hp <= 0) gameOver();
        }
      }
    }

    for (let i = beams.length - 1; i >= 0; i--) {
      beams[i].life -= dt;
      if (beams[i].life <= 0) beams.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 1 - 2.2 * dt;
      p.vy *= 1 - 2.2 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y -= 34 * U * dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    for (let i = waves.length - 1; i >= 0; i--) {
      waves[i].life -= dt;
      if (waves[i].life <= 0) waves.splice(i, 1);
    }
    for (const st of stars) {
      st.y += (st.v * dt) / H;
      if (st.y > 1) { st.y = 0; st.x = Math.random(); }
    }

    draw();
    requestAnimationFrame(frame);
  }

  // ── Gambar ────────────────────────────────────────────────────────────────
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    const n = a.verts.length;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      const rr = a.r * a.verts[i];
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-a.r * 0.3, -a.r * 0.3, a.r * 0.2, 0, 0, a.r * 1.1);
    g.addColorStop(0, a.hit > 0 ? "#fff7ed" : "#9ca3af");
    g.addColorStop(1, a.hit > 0 ? "#fb923c" : "#4b5563");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = Math.max(1, 1.5 * U);
    ctx.stroke();
    if (a.hp < a.maxHp) {
      // retakan — indikator asteroid terluka
      ctx.strokeStyle = "rgba(254,204,220,0.65)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-a.r * 0.5, -a.r * 0.4);
      ctx.lineTo(a.r * 0.1, 0);
      ctx.lineTo(-a.r * 0.2, a.r * 0.55);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHud() {
    const pad = 14 * U;
    const ui = Math.max(1, U);

    // judul + skor
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(196,181,253,0.75)";
    ctx.font = "700 " + 11 * ui + "px system-ui, sans-serif";
    ctx.fillText("GALAXY DEFENSE", pad, pad + 11 * ui);
    ctx.fillStyle = "#ffffff";
    ctx.font = "800 " + Math.max(16, 26 * U) + "px system-ui, sans-serif";
    ctx.fillText(fmt(S.score), pad, pad + 11 * ui + Math.max(18, 30 * U));

    // kombo
    ctx.textAlign = "right";
    ctx.fillStyle = "#fbbf24";
    ctx.font = "700 " + Math.max(12, 16 * U) + "px system-ui, sans-serif";
    ctx.fillText("KOMBO " + S.combo + " · x" + S.mult, W - pad, pad + Math.max(13, 17 * U));

    // banner perayaan / info
    if (S.banner) {
      const b = S.banner;
      ctx.globalAlpha = Math.min(1, b.life / 0.5);
      ctx.textAlign = "center";
      ctx.font = "800 " + Math.max(13, 20 * U) + "px system-ui, sans-serif";
      const tw = ctx.measureText(b.text).width;
      const bh = Math.max(30, 40 * U);
      const bx = W / 2;
      const by2 = Math.max(46 * U, H * 0.16);
      ctx.fillStyle = "rgba(9,10,20,0.82)";
      roundRect(bx - tw / 2 - 18 * U, by2 - bh * 0.55, tw + 36 * U, bh, Math.max(8, 12 * U));
      ctx.fill();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = b.color;
      ctx.fillText(b.text, bx, by2 + Math.max(4, 6 * U));
      ctx.globalAlpha = 1;
    }

    // status koneksi / idle
    ctx.textAlign = "center";
    ctx.font = "600 " + Math.max(10, 13 * U) + "px system-ui, sans-serif";
    if (!S.connected) {
      ctx.fillStyle = "rgba(148,163,184,0.85)";
      ctx.fillText("Koneksi event terputus — mencoba lagi…", W / 2, H - 72 * U);
    } else if (!S.gotEvent) {
      ctx.fillStyle = "rgba(148,163,184,0.75)";
      ctx.fillText("Menunggu event live… (mode simulate juga bisa)", W / 2, H - 72 * U);
    }

    // bar HP base
    const barH = Math.max(5, 8 * U);
    const x = pad, w = W - pad * 2, y = H - barH - Math.max(6, 9 * U);
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundRect(x, y, w, barH, barH / 2);
    ctx.fill();
    const ratio = Math.max(0, S.hp / S.hpMax);
    if (ratio > 0) {
      ctx.fillStyle = ratio > 0.5 ? "#4ade80" : ratio > 0.25 ? "#fbbf24" : "#ef4444";
      roundRect(x, y, Math.max(barH, w * ratio), barH, barH / 2);
      ctx.fill();
    }
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "700 " + Math.max(9, 11 * U) + "px system-ui, sans-serif";
    ctx.fillText("BASE " + S.hp + "/" + S.hpMax, x, y - 5 * U);
  }

  function draw() {
    ctx.save();
    if (S.shake > 0.3) ctx.translate(rnd(-S.shake, S.shake), rnd(-S.shake, S.shake));

    // latar + bintang
    ctx.fillStyle = "#05060f";
    ctx.fillRect(-40, -40, W + 80, H + 80);
    for (const st of stars) {
      ctx.globalAlpha = 0.25 + st.s * 0.3;
      ctx.fillStyle = "#c7d2fe";
      ctx.fillRect(st.x * W, st.y * H, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    // pangkalan
    const by = baseY(), bw = 170 * U, bh = 26 * U;
    const grad = ctx.createLinearGradient(W / 2 - bw / 2, by, W / 2 + bw / 2, by);
    grad.addColorStop(0, "#1e1b4b");
    grad.addColorStop(0.5, "#4c1d95");
    grad.addColorStop(1, "#1e1b4b");
    ctx.fillStyle = grad;
    roundRect(W / 2 - bw / 2, by, bw, bh, 8 * U);
    ctx.fill();
    ctx.strokeStyle = "rgba(167,139,250,0.7)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#312e81";
    ctx.beginPath();
    ctx.arc(W / 2, by, 26 * U, Math.PI, 0);
    ctx.fill();
    const c = cannon();
    ctx.fillStyle = "#a855f7";
    ctx.fillRect(c.x - 4 * U, c.y - 20 * U, 8 * U, 22 * U);
    if (S.shield > 0) {
      ctx.globalAlpha = Math.min(1, S.shield);
      ctx.strokeStyle = "#22d3ee";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(W / 2, by + bh / 2, bw * 0.85, bh * 1.5, 0, 0, 6.29);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (const a of asteroids) drawAsteroid(a);

    // gelombang kejut share — cincin membesar dari base
    for (const w of waves) {
      const t = 1 - Math.max(0, w.life) / w.max;
      ctx.globalAlpha = (1 - t) * 0.9;
      ctx.strokeStyle = "#34d399";
      ctx.lineWidth = Math.max(1, 5 * (1 - t));
      ctx.beginPath();
      ctx.arc(W / 2, baseY() + 13 * U, 30 * U + t * Math.max(W, H) * 0.55, 0, 6.29);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // sinar laser hadiah
    for (const b of beams) {
      const t = Math.max(0, b.life / 0.3);
      ctx.globalAlpha = t;
      ctx.strokeStyle = "#c084fc";
      ctx.lineWidth = 5 * U * t + 1;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1, 1.4);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // partikel (aditif)
    ctx.globalCompositeOperation = "lighter";
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    // angka damage melayang
    ctx.textAlign = "center";
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.color;
      ctx.font = "700 " + f.size + "px system-ui, sans-serif";
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore(); // akhir area goyang

    if (S.flash > 0.01) {
      ctx.fillStyle = "rgba(255,255,255," + S.flash + ")";
      ctx.fillRect(0, 0, W, H);
    }

    drawHud();
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
